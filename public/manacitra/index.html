<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mānacitra — AcharyLab Infrastructure</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04060e;font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;color:#c8d0e0;-webkit-font-smoothing:antialiased}
canvas{display:block}

#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#04060e;z-index:100;transition:opacity 1s ease}
#loader.hidden{opacity:0;pointer-events:none}
#loader h1{font-size:2.5rem;font-weight:300;letter-spacing:.12em;background:linear-gradient(135deg,#7c3aed,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
#loader .sub{color:rgba(255,255,255,0.25);font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.75rem}
#loader .status{color:rgba(255,255,255,0.2);font-size:.75rem;font-variant-numeric:tabular-nums}
.loader-ring{width:48px;height:48px;border:1.5px solid rgba(255,255,255,0.06);border-top-color:#7c3aed;border-radius:50%;animation:spin 1.2s cubic-bezier(0.4,0,0.2,1) infinite;margin-bottom:2rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-bar{width:160px;height:1.5px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:.75rem;overflow:hidden}
.loader-bar span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#3b82f6);border-radius:2px;transition:width .5s ease}

#header{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);z-index:10}
#header nav{display:flex;align-items:center;gap:1.25rem;padding:.5rem 1.25rem .5rem 1.5rem;background:rgba(4,6,14,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.06);border-radius:100px;font-size:.8rem}
#header .brand{font-weight:500;background:linear-gradient(135deg,#c8d0e0,#6b7a99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#header .sep{color:rgba(255,255,255,0.08)}
#header .stat{color:rgba(255,255,255,0.35);display:flex;align-items:center;gap:.35rem}
#header .stat .d{width:5px;height:5px;border-radius:50%;display:inline-block}
#header .stat .d.g{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,0.4)}
#header .stat .d.r{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,0.3)}
#header .lang{color:rgba(255,255,255,0.15);font-size:.7rem;display:flex;align-items:center;gap:.4rem}

#legend{position:fixed;bottom:1.5rem;left:1.5rem;z-index:10}
#legend button{background:rgba(4,6,14,0.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:.4rem .65rem;color:rgba(255,255,255,0.3);font-size:.7rem;cursor:pointer;transition:color .2s}
#legend button:hover{color:rgba(255,255,255,0.6)}
#legend-panel{position:absolute;bottom:calc(100% + .5rem);left:0;background:rgba(4,6,14,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:.85rem;min-width:150px;display:none;flex-direction:column;gap:.3rem}
#legend-panel.show{display:flex}
#legend-panel .l{display:flex;align-items:center;gap:.45rem;font-size:.7rem;color:rgba(255,255,255,0.35)}
#legend-panel .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

#tooltip{position:fixed;z-index:20;pointer-events:none;background:rgba(4,6,14,0.88);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:1rem;min-width:180px;max-width:300px;opacity:0;transition:opacity .3s ease;box-shadow:0 16px 48px rgba(0,0,0,0.5)}
#tooltip.show{opacity:1}
#tooltip .tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem;font-weight:500}
#tooltip h3{font-size:.9rem;font-weight:500;margin-bottom:.25rem}
#tooltip p{font-size:.78rem;color:rgba(255,255,255,0.4);line-height:1.5;margin-bottom:.5rem}
#tooltip .health{display:flex;align-items:center;gap:.35rem;font-size:.72rem}
#tooltip .health .dot{width:5px;height:5px;border-radius:50%}
#tooltip a{display:inline-flex;align-items:center;gap:.3rem;margin-top:.4rem;font-size:.72rem;color:#7c3aed;text-decoration:none;pointer-events:auto;padding:.25rem .5rem;background:rgba(124,58,237,0.1);border-radius:6px;transition:background .2s}
#tooltip a:hover{background:rgba(124,58,237,0.2)}

#hint{position:fixed;bottom:1.5rem;right:1.5rem;z-index:5;color:rgba(255,255,255,0.12);font-size:.65rem;text-align:right;line-height:1.6;pointer-events:none;transition:opacity 2s;opacity:0}
#hint.show{opacity:1}
#hint kbd{background:rgba(255,255,255,0.04);padding:1px 5px;border-radius:3px;font-family:inherit;font-size:.6rem}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <h1>मानचित्र</h1>
  <p class="sub">Infrastructure Map</p>
  <div class="loader-bar"><span id="load-progress"></span></div>
  <p class="status" id="load-status">Initializing...</p>
</div>

<div id="header">
  <nav>
    <span class="brand">मानचित्र</span>
    <span class="sep">·</span>
    <span class="stat"><span class="d g"></span><span id="count-online">--</span> online</span>
    <span class="stat" style="opacity:.5"><span class="d r"></span><span id="count-offline">--</span> offline</span>
    <span class="sep">·</span>
    <span class="lang"><span id="count-total">--</span> services</span>
  </nav>
</div>

<div id="legend">
  <button id="legend-btn">◈ Legend</button>
  <div id="legend-panel"></div>
</div>

<div id="tooltip"></div>
<div id="hint" class="show"><kbd>Drag</kbd> orbit · <kbd>Scroll</kbd> zoom · <kbd>Click</kbd> inspect</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const DATA = { islands:[], floating:[], connections:[], health:{}, stats:{} };
async function loadData() {
  const r = await fetch('data.json');
  Object.assign(DATA, await r.json());
}
const $ = s => document.querySelector(s);
const statusEl = $('#load-status');
const bar = $('#load-progress');

function progress(pct, msg) {
  bar.style.width = pct + '%';
  if (msg) statusEl.textContent = msg;
}

const S = { health: DATA.health };
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const clickables = [];
const labels = [];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060e);
scene.fog = new THREE.FogExp2(0x04060e, 0.018);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(16, 14, 20);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI / 2.1;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 0.5, 0);

controls.addEventListener('start', () => { controls.autoRotate = false; $('#hint').classList.remove('show'); });
setTimeout(() => controls.autoRotate = true, 3000);

function hcol(id) {
  const h = S.health[id];
  if (h === undefined) return 0x4466aa;
  return h.online ? 0x22c55e : 0xef4444;
}
function htxt(id) {
  const h = S.health[id];
  if (h === undefined) return ['dim','Unknown'];
  return h.online ? ['#22c55e','Online'] : ['#ef4444','Offline'];
}

function starField() {
  const g = new THREE.BufferGeometry();
  const n = 2000; const p = new Float32Array(n*3); const s = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const r = 30 + Math.random() * 40;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    p[i*3] = r * Math.sin(phi) * Math.cos(theta);
    p[i*3+1] = Math.abs(r * Math.cos(phi));
    p[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    s[i] = 0.3 + Math.random() * 0.7;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('size', new THREE.BufferAttribute(s, 1));
  const m = new THREE.PointsMaterial({ color:0x8899cc, size:0.12, transparent:true, opacity:0.6, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
  scene.add(new THREE.Points(g, m));
}

function lights() {
  const amb = new THREE.AmbientLight(0x223355, 0.8);
  scene.add(amb);

  const key = new THREE.DirectionalLight(0xffeedd, 2.5);
  key.position.set(12, 20, 8);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 40;
  key.shadow.camera.left = -15;
  key.shadow.camera.right = 15;
  key.shadow.camera.top = 15;
  key.shadow.camera.bottom = -15;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0x6666ff, 0.4);
  fill.position.set(-8, 6, -10);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0x4488ff, 0.2);
  rim.position.set(0, -4, 12);
  scene.add(rim);
}

function water() {
  const g = new THREE.PlaneGeometry(60, 60, 64, 64);
  const m = new THREE.MeshStandardMaterial({
    color: 0x080e20, roughness: 0.3, metalness: 0.6,
    transparent: true, opacity: 0.7,
  });
  const w = new THREE.Mesh(g, m);
  w.rotation.x = -Math.PI / 2;
  w.position.y = -0.4;
  w.receiveShadow = true;
  scene.add(w);

  const g2 = new THREE.PlaneGeometry(60, 60, 1, 1);
  const m2 = new THREE.MeshBasicMaterial({
    color: 0x0a1628, transparent: true, opacity: 0.4,
    side: THREE.DoubleSide,
  });
  const w2 = new THREE.Mesh(g2, m2);
  w2.rotation.x = -Math.PI / 2;
  w2.position.y = -0.45;
  scene.add(w2);
}

function island(data) {
  const g = new THREE.Group();
  g.position.set(data.x, -0.2, data.z);
  const c = new THREE.Color(data.color);

  const sz = data.size;

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(sz, 32),
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, metalness: 0.1, transparent: true, opacity: 0.15 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  g.add(ground);

  for (let i = 0; i < 4; i++) {
    const r = new THREE.Mesh(
      new THREE.RingGeometry(sz * (0.2 + i * 0.18), sz * (0.25 + i * 0.18), 32),
      new THREE.MeshStandardMaterial({
        color: c, roughness: 0.6, metalness: 0.3,
        transparent: true, opacity: 0.04 + i * 0.015,
        side: THREE.DoubleSide,
      })
    );
    r.rotation.x = -Math.PI / 2;
    r.position.y = -0.05 + i * 0.02;
    g.add(r);
  }

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(sz + 0.3, 0.06, 8, 48),
    new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.15, transparent: true, opacity: 0.2 })
  );
  rim.rotation.x = -Math.PI / 2;
  rim.position.y = 0.01;
  g.add(rim);

  const dl = document.createElement('div');
  dl.textContent = data.name;
  dl.style.cssText = 'color:#fff;font-size:12px;font-weight:500;letter-spacing:.08em;text-shadow:0 4px 20px rgba(0,0,0,0.9);background:rgba(4,6,14,0.6);backdrop-filter:blur(8px);padding:4px 12px;border-radius:8px;border:1px solid ' + data.color + '33;';
  const l = new CSS2DObject(dl);
  l.position.set(0, 0.15, -sz - 1.5);
  g.add(l);

  if (data.subtitle) {
    const sd = document.createElement('div');
    sd.textContent = data.subtitle;
    sd.style.cssText = 'color:rgba(255,255,255,0.2);font-size:9px;letter-spacing:.05em;text-align:center;';
    const sl = new CSS2DObject(sd);
    sl.position.set(0, -0.35, -sz - 1.5);
    g.add(sl);
  }

  return g;
}

function building(d, ix, total) {
  const g = new THREE.Group();
  const h = d.h || 1.0;
  const w = 0.55;
  const sp = 1.6;
  const row = Math.floor(ix / 5);
  const col = ix % 5;
  const ox = (col - Math.min(total - 1, 4) / 2) * sp;
  const oz = row * 1.6;
  g.position.set(ox, 0, oz);

  const bc = new THREE.Color(d.color);
  const hl = hcol(d.id);

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, w),
    new THREE.MeshStandardMaterial({ color: bc, roughness: 0.5, metalness: 0.4, transparent: true, opacity: 0.92 })
  );
  body.position.y = h / 2 + 0.05;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const cap = new THREE.Mesh(
    new THREE.BoxGeometry(w * 0.6, 0.08, w * 0.6),
    new THREE.MeshStandardMaterial({ color: bc.clone().offsetHSL(0, 0, 0.15), roughness: 0.3, metalness: 0.6 })
  );
  cap.position.y = h + 0.03;
  g.add(cap);

  if (h > 1.5) {
    const ant = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.03, 0.3, 4),
      new THREE.MeshStandardMaterial({ color: 0x8899bb, metalness: 0.8, roughness: 0.2 })
    );
    ant.position.set(0, h + 0.25, 0);
    g.add(ant);
  }

  const nWin = Math.floor(h * 2.5);
  for (let i = 0; i < nWin; i++) {
    const wx = (Math.random() - 0.5) * w * 0.5;
    const wz = (Math.random() - 0.5) * w * 0.5;
    const wy = 0.1 + (i / nWin) * h * 0.85;
    const side = Math.floor(Math.random() * 4);
    const win = new THREE.Mesh(
      new THREE.PlaneGeometry(0.07, 0.08),
      new THREE.MeshBasicMaterial({
        color: 0xfbbf24, transparent: true,
        opacity: 0.1 + Math.random() * 0.15,
      })
    );
    const off = w / 2 + 0.005;
    if (side === 0) { win.position.set(off, wy, wz); win.lookAt(1, 0, 0); }
    else if (side === 1) { win.position.set(-off, wy, wz); win.lookAt(-1, 0, 0); }
    else if (side === 2) { win.position.set(wx, wy, off); win.lookAt(0, 0, 1); }
    else { win.position.set(wx, wy, -off); win.lookAt(0, 0, -1); }
    g.add(win);
  }

  const glowGeo = new THREE.BoxGeometry(w * 0.35, 0.04, w * 0.35);
  const glowMat = new THREE.MeshBasicMaterial({
    color: hl, transparent: true, opacity: hl === 0x22c55e ? 0.4 : (hl === 0xef4444 ? 0.25 : 0.15),
    blending: THREE.AdditiveBlending,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.y = h + 0.1;
  g.add(glow);

  g.userData = { id: d.id, name: d.name, type: d.type, desc: d.desc, url: d.url, color: d.color };
  clickables.push(g);
  return g;
}

function floatingIsland(d, idx) {
  const g = new THREE.Group();
  const ang = (idx / DATA.floating.length) * Math.PI * 2;
  const r = 5.5;
  g.position.set(Math.cos(ang) * r, 3.2 + Math.sin(idx * 1.7) * 0.2, Math.sin(ang) * r);
  g.rotation.z = Math.sin(idx * 2.3) * 0.03;
  g.rotation.x = Math.cos(idx * 1.9) * 0.03;
  const c = new THREE.Color(d.color);

  const base = new THREE.Mesh(
    new THREE.CircleGeometry(0.7, 12),
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.2, transparent: true, opacity: 0.25 })
  );
  base.rotation.x = -Math.PI / 2;
  base.position.y = -0.03;
  g.add(base);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.55, 0.8, 16),
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.4, transparent: true, opacity: 0.1, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  g.add(ring);

  const bw = 0.45, bh = 0.35;
  const bBody = new THREE.Mesh(
    new THREE.BoxGeometry(bw, bh, bw),
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.3, transparent: true, opacity: 0.92 })
  );
  bBody.position.y = bh / 2;
  bBody.castShadow = true;
  g.add(bBody);

  const bCap = new THREE.Mesh(
    new THREE.BoxGeometry(bw * 0.5, 0.05, bw * 0.5),
    new THREE.MeshStandardMaterial({ color: c.clone().offsetHSL(0, 0, 0.15), roughness: 0.3, metalness: 0.5 })
  );
  bCap.position.y = bh + 0.02;
  g.add(bCap);

  const hl = hcol(d.id);
  const fg = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 0.03, 0.15),
    new THREE.MeshBasicMaterial({ color: hl, transparent: true, opacity: hl === 0x22c55e ? 0.4 : (hl === 0xef4444 ? 0.25 : 0.1), blending: THREE.AdditiveBlending })
  );
  fg.position.y = bh + 0.06;
  g.add(fg);

  const dl = document.createElement('div');
  dl.textContent = d.name;
  dl.style.cssText = 'color:#fff;font-size:8px;font-weight:500;text-shadow:0 2px 12px rgba(0,0,0,0.9);background:rgba(4,6,14,0.6);backdrop-filter:blur(6px);padding:2px 6px;border-radius:4px;white-space:nowrap;';
  const l = new CSS2DObject(dl);
  l.position.set(0, 0.55, 0);
  g.add(l);

  g.userData = { id: d.id, name: d.name, type: d.type, desc: d.desc, url: d.url, color: d.color };
  clickables.push(g);
  return g;
}

function connection(from, to, label, color='#3b82f6') {
  const midX = (from.x + to.x) / 2;
  const midZ = (from.z + to.z) / 2;
  const dy = Math.abs(to.y - from.y);
  const midY = Math.max(from.y, to.y) + dy * 0.3 + 0.5;

  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(from.x, from.y + 0.1, from.z),
    new THREE.Vector3(midX, midY, midZ),
    new THREE.Vector3(to.x, to.y + 0.1, to.z),
  );

  const pts = curve.getPoints(40);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.08 });
  scene.add(new THREE.Line(geo, mat));

  const glowMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.25 });
  const glow = new THREE.Line(geo.clone(), glowMat);
  scene.add(glow);

  if (label) {
    const mid = curve.getPoint(0.5);
    const ld = document.createElement('div');
    ld.textContent = label;
    ld.style.cssText = 'color:rgba(255,255,255,0.1);font-size:6px;letter-spacing:.08em;text-transform:uppercase;';
    const ll = new CSS2DObject(ld);
    ll.position.copy(mid);
    ll.position.y += 0.3;
    scene.add(ll);
  }
}

function findPos(id) {
  for (const isl of DATA.islands)
    for (const b of isl.buildings)
      if (b.id === id) {
        const ix = isl.buildings.indexOf(b);
        const sp = 1.6;
        const row = Math.floor(ix / 5), col = ix % 5;
        const ox = (col - Math.min(isl.buildings.length - 1, 4) / 2) * sp;
        const oz = row * 1.6;
        return { x: isl.x + ox, y: 0.3, z: isl.z + oz };
      }
  for (const f of DATA.floating)
    if (f.id === id) {
      const idx = DATA.floating.indexOf(f);
      const ang = (idx / DATA.floating.length) * Math.PI * 2;
      return { x: Math.cos(ang) * 5.5, y: 3.4, z: Math.sin(ang) * 5.5 };
    }
  return null;
}

function build() {
  progress(20, 'Building scene...');
  starField();
  lights();
  water();

  progress(30, 'Placing islands...');
  DATA.islands.forEach(isl => {
    const ig = island(isl);
    scene.add(ig);
    isl.buildings.forEach((b, i) => {
      const bg = building(b, i, isl.buildings.length);
      ig.add(bg);
    });
  });

  progress(50, 'Creating floating islands...');
  const fg = new THREE.Group();
  DATA.floating.forEach((f, i) => fg.add(floatingIsland(f, i)));
  scene.add(fg);

  progress(65, 'Connecting services...');
  DATA.connections.forEach(c => {
    const fp = findPos(c.from), tp = findPos(c.to);
    if (fp && tp) connection(fp, tp, c.label);
  });

  progress(75, 'Computing status...');

  const health = DATA.health || {};
  let online = 0, offline = 0, total = 0;
  const allIds = new Set();
  DATA.islands.forEach(i => i.buildings.forEach(b => allIds.add(b.id)));
  DATA.floating.forEach(f => allIds.add(f.id));
  allIds.forEach(id => {
    total++;
    const h = health[id];
    if (h === undefined) return;
    h.online ? online++ : offline++;
  });

  S.online = online; S.offline = offline; S.total = total;
  $('#count-online').textContent = online;
  $('#count-offline').textContent = offline;
  $('#count-total').textContent = total;

  progress(85, 'Finalizing...');
}

function setupUI() {
  const legendTypes = [
    ['#22c55e','Online'], ['#ef4444','Offline'], ['#4466aa','Unknown'],
    ['#2563eb','Database'], ['#dc2626','Proxy'], ['#059669','API'],
    ['#7c3aed','Auth'], ['#f59e0b','Service'], ['#22c55e','App'],
    ['#06b6d4','Monitor'], ['#38bdf8','Network'], ['#e11d48','Storage'],
  ];
  const lp = $('#legend-panel');
  legendTypes.forEach(([c, l]) => {
    const e = document.createElement('div'); e.className = 'l';
    e.innerHTML = '<div class="sw" style="background:' + c + '"></div>' + l;
    lp.appendChild(e);
  });
  $('#legend-btn').addEventListener('click', () => lp.classList.toggle('show'));

  renderer.domElement.addEventListener('pointermove', e => {
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  });

  renderer.domElement.addEventListener('click', e => {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(clickables, true);
    if (hits.length) {
      let o = hits[0].object;
      while (o.parent && !o.parent.userData?.id) o = o.parent;
      const d = o.parent?.userData || o.userData;
      if (d?.id) { showTip(d, e.clientX, e.clientY); return; }
    }
    hideTip();
  });
}

function showTip(d, x, y) {
  const el = $('#tooltip');
  el.className = 'show';
  const [hc, ht] = htxt(d.id);
  const dot = hc === '#22c55e' ? '🟢' : (hc === '#ef4444' ? '🔴' : '⚪');
  el.innerHTML = `
    <div class="tag" style="color:${d.color||'#f59e0b'}">${d.type||'service'}</div>
    <h3>${d.name}</h3>
    ${d.desc ? '<p>'+d.desc+'</p>' : ''}
    <div class="health"><span class="dot" style="background:${hc}"></span> ${ht}</div>
    ${d.url ? '<a href="'+d.url+'" target="_blank">↗ Open</a>' : ''}
  `;
  const bw = Math.min(el.offsetWidth, 300);
  el.style.left = Math.min(x + 14, innerWidth - bw - 16) + 'px';
  el.style.top = Math.min(y + 14, innerHeight - el.offsetHeight - 16) + 'px';
}

function hideTip() { $('#tooltip').className = ''; }

let floatGroup, floatTime = 0;
function anim() {
  requestAnimationFrame(anim);
  controls.update();

  const t = Date.now() * 0.0003;
  floatTime = t;
  if (floatGroup) {
    floatGroup.children.forEach((c, i) => {
      const by = 3.2 + Math.sin(i * 1.7) * 0.2;
      c.position.y = by + Math.sin(t + i * 1.1) * 0.04;
    });
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

async function init() {
  progress(5, 'Loading data...');
  await loadData();

  progress(15, 'Parsing infrastructure...');
  Object.assign(S.health, DATA.health || {});

  build();
  setupUI();
  progress(100, 'Ready');

  floatGroup = scene.children.find(c => c.type === 'Group' && c.children.length === DATA.floating.length);

  setTimeout(() => $('#loader').classList.add('hidden'), 400);
  setTimeout(() => controls.autoRotate = true, 2000);

  anim();
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

init().catch(e => {
  statusEl.textContent = 'Error: ' + e.message;
  console.error(e);
});
</script>
</body>
</html>
